<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="oa-git — Git for Cadence OpenAccess">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
    <radialGradient id="glowL" cx="18%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="84%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="capLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="104" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="resLine" gradientUnits="userSpaceOnUse" x1="104" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.45"/>
    </pattern>
    <style>
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowL)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowR)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.25" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ================= LEFT: SIMPLE BRAND STATEMENT ================= -->
  <g transform="translate(56, 76)">
    <!-- Minimal Silicon Hexagon + Git Fork Icon -->
    <polygon points="28,2 52,16 52,44 28,58 4,44 4,16" fill="#0d1726" stroke="url(#hexStroke)" stroke-width="2.4"/>
    <line x1="20" y1="18" x2="20" y2="42" stroke="#34d399" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 20 35 C 20 26, 36 28, 36 20" fill="none" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="20" cy="17" r="4" fill="#34d399"/>
    <circle cx="20" cy="43" r="4" fill="#38bdf8"/>
    <circle cx="36" cy="19" r="4" fill="#fbbf24"/>

    <!-- Wordmark -->
    <text x="72" y="47" class="sans" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">oa-git</text>

    <!-- One-sentence value proposition -->
    <text x="2" y="102" class="sans" font-size="22" font-weight="700" fill="#e2e8f0">Git for Cadence OpenAccess</text>
    <text x="2" y="132" class="sans" font-size="15" fill="#94a3b8">Turn Virtuoso binaries into clean Git diffs.</text>

    <!-- Clean 3-word scope line -->
    <text x="2" y="170" class="mono" font-size="13" fill="#34d399">Schematic · Symbol · Layout</text>
  </g>

  <!-- ================= RIGHT: 3-SECOND VISUAL EQUATION ================= -->
  <!-- Card 1: Virtuoso OA Binary -->
  <g transform="translate(490, 56)">
    <rect x="0" y="0" width="230" height="208" rx="14" fill="#0c1322" stroke="#334155" stroke-width="1.4"/>
    <rect x="20" y="0" width="190" height="3.5" rx="1.75" fill="#f59e0b"/>
    <text x="24" y="38" class="sans" font-size="15" font-weight="700" fill="#fbbf24">Cadence Virtuoso</text>
    <text x="24" y="58" class="sans" font-size="12" fill="#64748b">Binary .oa files</text>

    <!-- 3 crisp OA file rows -->
    <rect x="20" y="76" width="190" height="32" rx="7" fill="#131d31" stroke="#25344d" stroke-width="1"/>
    <circle cx="36" cy="92" r="4" fill="#f59e0b"/>
    <text x="50" y="97" class="mono" font-size="13" fill="#e2e8f0">sch.oa</text>

    <rect x="20" y="116" width="190" height="32" rx="7" fill="#131d31" stroke="#25344d" stroke-width="1"/>
    <circle cx="36" cy="132" r="4" fill="#38bdf8"/>
    <text x="50" y="137" class="mono" font-size="13" fill="#e2e8f0">symbol.oa</text>

    <rect x="20" y="156" width="190" height="32" rx="7" fill="#131d31" stroke="#25344d" stroke-width="1"/>
    <circle cx="36" cy="172" r="4" fill="#34d399"/>
    <text x="50" y="177" class="mono" font-size="13" fill="#e2e8f0">layout.oa</text>
  </g>

  <!-- Center Bidirectional Arrows -->
  <g transform="translate(736, 114)">
    <!-- capture -->
    <text x="58" y="10" class="mono" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">capture</text>
    <line x1="6" y1="24" x2="100" y2="24" stroke="url(#capLine)" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="110,24 99,18 99,30" fill="#38bdf8"/>

    <!-- Official SKILL label -->
    <rect x="14" y="38" width="88" height="22" rx="11" fill="#131e30" stroke="#2a3c55" stroke-width="1"/>
    <text x="58" y="53" class="mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">SKILL API</text>

    <!-- restore -->
    <line x1="110" y1="74" x2="16" y2="74" stroke="url(#resLine)" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="6,74 17,68 17,80" fill="#f59e0b"/>
    <text x="58" y="96" class="mono" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">restore</text>
  </g>

  <!-- Card 2: Standard Git Text -->
  <g transform="translate(868, 56)">
    <rect x="0" y="0" width="276" height="208" rx="14" fill="#0c1322" stroke="#334155" stroke-width="1.4"/>
    <rect x="20" y="0" width="236" height="3.5" rx="1.75" fill="#10b981"/>
    <text x="24" y="38" class="sans" font-size="15" font-weight="700" fill="#34d399">Standard Git</text>
    <text x="24" y="58" class="sans" font-size="12" fill="#64748b">Readable YAML &amp; JSONL</text>

    <!-- Clean 3-line semantic diff preview -->
    <rect x="20" y="76" width="236" height="84" rx="8" fill="#080d17" stroke="#1e2d42" stroke-width="1"/>
    <text x="34" y="100" class="mono" font-size="12.5" fill="#94a3b8">circuit.yaml</text>
    <text x="34" y="122" class="mono" font-size="12.5" fill="#f87171">- M1.w: 10u</text>
    <text x="34" y="144" class="mono" font-size="12.5" fill="#34d399">+ M1.w: 20u</text>

    <!-- Bottom capability summary -->
    <text x="138" y="185" class="mono" font-size="12.5" fill="#7dd3fc" text-anchor="middle">Diff · Merge · Branch · PR</text>
  </g>
</svg>
